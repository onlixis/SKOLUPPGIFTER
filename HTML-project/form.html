<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <title>Studentformulär</title>
</head>

<body>

    <h1>Studentformulär</h1>

    <form>
        <p>
            <label for="namn">Namn:</label><br>
            <input type="text" id="namn" name="namn">
        </p>

        <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email">
        </p>

        <p>
            <label for="subject">Favoritämne:</label><br>
            <select id="subject" name="subject">
                <option value="matematik">Matematik</option>
                <option value="svenska">Svenska</option>
                <option value="engelska">Engelska</option>
                <option value="programmering">Programmering</option>
                <option value="biologi">Biologi</option>
                <option value="historia">Historia</option>
            </select>
        </p>

        <p>
            Hobbyer:<br>
            <input type="checkbox" id="fotboll" name="hobby" value="fotboll">
            <label for="fotboll">Fotboll</label><br>

            <input type="checkbox" id="lasa" name="hobby" value="lasa">
            <label for="lasa">Läsa böcker</label><br>

            <input type="checkbox" id="spel" name="hobby" value="spel">
            <label for="spel">Datorspel</label><br>

            <input type="checkbox" id="musik" name="hobby" value="musik">
            <label for="musik">Spela musik</label>
        </p>

        <p>
            <input type="submit" value="Skicka">
            <input type="reset" value="Rensa">
        </p>
    </form>

    <p><a href="index.html">Tillbaka till startsidan</a></p>

</body>

</html>
