<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logga in</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="container">
        <header class="topbar">
            <h1>Logga in</h1>
            <nav class="nav">
                <a href="index.html">Startsida</a>
                <a href="form.html">Formulär</a>
                <a href="login.html">Logga in</a>
                <a href="register.html">Registrera</a>
            </nav>
        </header>

        <main>
            <section class="form-card">
                <form>
                    <div class="form-group">
                        <label for="username">Elevens namn/användarnamn:</label>
                        <input type="text" id="username" name="username">
                    </div>

                    <div class="form-group">
                        <label for="password">Lösenord:</label>
                        <input type="password" id="password" name="password">
                    </div>

                    <div class="button-row">
                        <input type="submit" value="Logga in" class="btn btn-primary">
                        <input type="reset" value="Återställ" class="btn btn-secondary">
                    </div>
                </form>
            </section>

            <p class="link-row">
                Har du inget konto? <a href="register.html">Gå till registrering</a>
            </p>
        </main>
    </div>
</body>

</html>
